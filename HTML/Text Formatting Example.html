<!DOCTYPE html>
<html>
  <head>
<!-- Sub Subscript sup superscript i Italic u underline b bold marquee scrolling or moving text -->
    <title>Paragraph</title>
  </head>
  <body>
    <marquee><h1>About Me</h1></marquee>

    <p>My name is <b>Pingu</b>. I am <i>10 years old</i>. I stay in <u>Antarctica</u>.</p>
    <p>I'm studying website development <sub>course</sub> here. Do you also want to <sup>learn</sup>?</p>
  </body>
</html>
