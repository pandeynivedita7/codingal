<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        /* Main title */
        .title1 {
            font-size: 26px;
            font-weight: bold;
            display: inline-block; 
            border: 6px solid red;
            padding: 10px 20px;
            margin-bottom: 10px;
        }

        /* Subtitle */
        .subtitle {
            font-style: unset;
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Button */
        .btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #000;
            background: #17dc2b;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1 class="title1">WELCOME TO XXX ELECTRONICS</h1>
    <p class="subtitle">All your electronics needs in one place</p>
    <button class="btn">view more</button>

</body>

</html>
