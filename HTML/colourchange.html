<!DOCTYPE html>
<html>
<head>

<style>
@keyframes colorAnim {
  0% { color: red; }
  50% { color: blue; }
  60% { color: green; }
  80% { color: orange; }
  100% { color: red; }
}

h2 {
  font-size: 24px;
  text-decoration: underline;
  animation: colorAnim 2s infinite;
}
</style>

</head>

<body>

<h2>Color Change</h2>

</body>
</html>
