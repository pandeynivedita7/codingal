<!DOCTYPE html>
<html>
<body>

<h2>JavaScript For Loop</h2>

<script>
  var dogs = ["bulldog", "beagle", "poodle"]; // List of dog breeds

  for (var i = 0; i < dogs.length; i++) { // Loop through the list
    var text = dogs[i] + "<br>";
    document.write(text); // Output each item with a line break
  }
</script>

</body>
</html>
