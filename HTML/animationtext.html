<!DOCTYPE html>
<html>
<head>
<style>
@keyframes colorChange {
    0%   { color: red; }
    50%  { color: blue; }
    60%  { color: green; }
    80%  { color: orange; }
    100% { color: red; }
}

.animated-link {
    font-size: 24px;
    text-decoration: underline;
    animation: colorChange 2s infinite;
}
</style>
</head>

<body>

<a href="#" class="animated-link">Color Change</a>

</body>
</html>
