<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank App - Income & Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .balance {
      text-align: center;
      margin: 20px 0;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      margin-bottom: 20px;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
    }

    .money {
      font-size: 1.2em;
    }

    .plus {
      color: green;
    }

    .minus {
      color: red;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    form input,
    form select,
    form button {
      padding: 10px;
      font-size: 1em;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    form button {
      background-color: #2ecc71;
      color: white;
      border: none;
      cursor: pointer;
    }

    form button:hover {
      background-color: #27ae60;
    }

    .list {
      list-style: none;
      padding: 0;
    }

    .list li {
      background: #f9f9f9;
      padding: 10px;
      margin: 10px 0;
      border-left: 5px solid;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list li.income {
      border-color: green;
    }

    .list li.expense {
      border-color: red;
    }

    .delete-btn {
      background: transparent;
      color: red;
      border: none;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>💰 Bank App - Income & Expense Tracker</h2>

    <div class="balance">
      <h3>Your Balance</h3>
      <h1 id="balance">$0.00</h1>
    </div>

    <div class="summary">
      <div>
        <h4>Income</h4>
        <p id="income" class="money plus">+$0.00</p>
      </div>
      <div>
        <h4>Expense</h4>
        <p id="expense" class="money minus">-$0.00</p>
      </div>
    </div>

    <form id="form">
      <input type="text" id="description" placeholder="Description" required />
      <input type="number" id="amount" placeholder="Amount (e.g., 100 or -100)" required />
      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <button type="submit">Add Transaction</button>
    </form>

    <h3>Transaction History</h3>
    <ul id="transaction-list" class="list"></ul>
  </div>

  <script>
    const form = document.getElementById('form');
    const description = document.getElementById('description');
    const amount = document.getElementById('amount');
    const type = document.getElementById('type');
    const transactionList = document.getElementById('transaction-list');
    const balanceDisplay = document.getElementById('balance');
    const incomeDisplay = document.getElementById('income');
    const expenseDisplay = document.getElementById('expense');

    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const transaction = {
        id: Date.now(),
        description: description.value,
        amount: +amount.value,
        type: type.value
      };

      if (transaction.description.trim() === '' || isNaN(transaction.amount)) {
        alert("Please enter a valid description and amount.");
        return;
      }

      transactions.push(transaction);
      saveAndRender();

      description.value = '';
      amount.value = '';
      type.value = 'income';
    });

    function deleteTransaction(id) {
      transactions = transactions.filter(tx => tx.id !== id);
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('transactions', JSON.stringify(transactions));
      renderTransactions();
      updateBalance();
    }

    function renderTransactions() {
      transactionList.innerHTML = '';
      transactions.forEach(tx => {
        const li = document.createElement('li');
        li.classList.add(tx.type);
        li.innerHTML = `
          ${tx.description} 
          <span>${tx.type === 'income' ? '+' : '-'}$${Math.abs(tx.amount)}</span>
          <button class="delete-btn" onclick="deleteTransaction(${tx.id})">x</button>
        `;
        transactionList.appendChild(li);
      });
    }

    function updateBalance() {
      const income = transactions
        .filter(tx => tx.type === 'income')
        .reduce((sum, tx) => sum + tx.amount, 0);

      const expense = transactions
        .filter(tx => tx.type === 'expense')
        .reduce((sum, tx) => sum + tx.amount, 0);

      const balance = income - expense;

      incomeDisplay.innerText = `+$${income.toFixed(2)}`;
      expenseDisplay.innerText = `-$${expense.toFixed(2)}`;
      balanceDisplay.innerText = `$${balance.toFixed(2)}`;
    }

    saveAndRender();
  </script>
</body>
</html>
