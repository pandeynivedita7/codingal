<!DOCTYPE html>
<html>
<body>
	<h2> Operator</h2>
	​<p id="demo"></p>
  ​<p id="demo1"></p>
  ​<p id="demo2"></p>
  ​<p id="demo3"></p>
	<p id="demo4"></p>
	​<script>
		<!--Addition-->
    //*use +, -, *, / operators*//
    var x = 5;
    var y = 2;
    var z = x + y;
     var a = x - y;
      var b = x * y;
       var c = x / y;
	document.getElementById("demo").innerHTML = z;
  document.getElementById("demo1").innerHTML = a;
  document.getElementById("demo2").innerHTML = b;
  document.getElementById("demo3").innerHTML = c;

	// assignment operator x=x+4  x+=4 
    // x=x+5 x+=5   y=y+10 y+=10//
	x += 4; //x=x+5 x+=5  y+=10 y=y+10 z+=9 z=z+9
    document.getElementById("demo4").innerHTML = x;
	</script>
</body>
</html>
