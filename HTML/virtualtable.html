<!DOCTYPE html>
<html>
<head>
    <title>Virtual Tables</title>
</head>
<body>

<h2>Virtual tables — Example</h2>
<p>Responsive table shown in simple HTML only.</p>

<table border="1" cellpadding="8" cellspacing="0">
    <tr>
        <th>Column A</th>
        <th>Column B</th>
        <th>Column C</th>
    </tr>

    <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
    </tr>

    <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
    </tr>
</table>

</body>
</html>
<!---<table> – defines a table

<tr> – table row

<td> – table data cell

<th> – table header cell

<caption> – table title

<thead> – header section

<tbody> – body section

<tfoot> – footer section

<col> – defines column properties

<colgroup> – groups columns -->
