<!DOCTYPE html>
<html>
<body>

<h2>Using join() in JavaScript</h2>
<p id="joinResult"></p>

<script>//javascri[t]
  var cars = ["Ford", "Ferrari", "BMW", "Honda", "Toyota"]; //array
  var result = cars.join(" - "); // Join with dash join method into single string
  document.getElementById("joinResult").innerHTML = result;//display result
</script>

</body>
</html>
