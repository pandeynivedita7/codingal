<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Clickable Image and Text Link</title>
    <style>
        .link-box {
            background-color: #ffcccc;
            /* Light red background */
            text-decoration: underline;
            font-weight: bold;
            padding: 10px;
            display: inline-block;
            border-radius: 5px;
            color: black;
        }

        .link-box img {
            vertical-align: middle;
            height: 50px;
            /* Adjust as needed */
        }
    </style>
</head>

<body>

    <a href="https://example.com" class="link-box">
        <img src="https://via.placeholder.com/50" alt="Icon">
        Visit Our Website
    </a>

</body>

</html>
