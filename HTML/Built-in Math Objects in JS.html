<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Math Object Methods</title>
</head>
<body>

<script type="text/javascript">
// Math.SQRT2 is a constant, not a function. So, you should not call it with ().
var value1 = Math.SQRT2;
document.write("Demo1 Test Value (Math.SQRT2): " + value1 + "<br>");

// Correct use of Math.sqrt()
var value2 = Math.sqrt(60);
document.write("Demo2 Test Value (Math.sqrt(60)): " + value2 + "<br>");

// Correct use of Math.hypot()
var value3 = Math.hypot(0.00005);
document.write("Demo3 Test Value (Math.hypot(0.00005)): " + value3 + "<br>");
</script>

</body>
</html>
