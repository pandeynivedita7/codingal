<html> <!-- Opens the HTML document -->
  <head>
    <title>JavaScript Math Object Methods</title> <!-- Sets the title of the webpage (seen on browser tab) -->
  </head>
  
  <body> <!-- Starts the body section where visible content appears -->

    <script type="text/javascript"> <!-- Begins the JavaScript code block -->

      // Using Math.acos() - returns arccosine (inverse cosine) of a number in radians
      // Math.acos(-1) returns π (approximately 3.14159) because cos(π) = -1
      var value = Math.acos(-1); 
      document.write("Demo1 Test Value : " + value + "<br>"); 
      // Writes the result of Math.acos(-1) to the browser, followed by a line break 

      // Using Math.asin() - returns arcsine (inverse sine) of a number in radians
      // Math.asin(1) returns π/2 (approximately 1.5708) because sin(π/2) = 1
      var value = Math.asin(1); 
      document.write("Demo2 Test Value : " + value + "<br>"); 
      // Writes the result of Math.asin(1) to the browser, followed by a line break

      // Using Math.atan() - returns arctangent (inverse tangent) of a number in radians
      // Math.atan(0.5) returns approximately 0.4636 because tan(0.4636) ≈ 0.5
      var value = Math.atan(0.5); 
      document.write("Demo3 Test Value : " + value + "<br>"); 
      // Writes the result of Math.atan(0.5) to the browser, followed by a line break

    </script> <!-- Ends the JavaScript code block -->

  </body> <!-- Ends the body of the document -->
</html> <!-- Closes the HTML document -->
//
