<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank App - Income & Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #f4f4f4;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 400px;
  margin: 50px auto;
  background: #fff;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h2, h3 {
  text-align: center;
}

.income-expense {
  display: flex;
  justify-content: space-between;
  margin: 20px 0;
}

.money {
  font-size: 20px;
}

.plus {
  color: green;
}

.minus {
  color: red;
}

.list {
  list-style: none;
  padding: 0;
  margin-bottom: 20px;
}

.list li {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-right: 5px solid;
  margin: 10px 0;
  background: #f9f9f9;
}

.list li.plus {
  border-color: green;
}

.list li.minus {
  border-color: red;
}

form input, form button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

form button {
  background-color: #333;
  color: #fff;
  border: none;
  cursor: pointer;
}

  </style>
<body>
  <div class="container">
    <h2>Bank App</h2>
    <div class="balance-container">
      <h3>Your Balance</h3>
      <h1 id="balance">₹0.00</h1>
    </div>

    <div class="income-expense">
      <div>
        <h4>Income</h4>
        <p id="income" class="money plus">₹0.00</p>
      </div>
      <div>
        <h4>Expense</h4>
        <p id="expense" class="money minus">₹0.00</p>
      </div>
    </div>

    <h3>Transaction History</h3>
    <ul id="transaction-list" class="list"></ul>

    <h3>Add New Transaction</h3>
    <form id="form">
      <input type="text" id="text" placeholder="Enter description" required>
      <input type="number" id="amount" placeholder="Enter amount (+/-)" required>
      <button type="submit">Add Transaction</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
