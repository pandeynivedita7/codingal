<!DOCTYPE html>
<html>
  <body>

    <p>Finding the largest number with help of Argument Objects  </p>
    <p id="result"></p>
    <script>
      function findMax() {// use of function reuse 
        
        var max = 0;
        for(i = 0; i < arguments.length; i++) {// travel in list for(int;cond;++/--)
          if (arguments[i] > max) {
            max = arguments[i];
          }
        }
        return max;
      } 
      document.getElementById("result").innerHTML = findMax(8, 4, 5, 6, 10);
    </script>

  </body>
</html>
